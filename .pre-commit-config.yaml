# Run the project linter before every commit. The linter version is pinned by
# mise (mise.toml) and invoked through the Taskfile, so pre-commit, the
# Taskfile, and any CI all use the same golangci-lint.
#
# Install the hook once per clone:  task hooks   (or: pre-commit install)
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint (golangci-lint via task)
        entry: task lint
        language: system
        pass_filenames: false
        types: [go]
